; platformio.ini
[env:esp32dev]
platform = espressif32
board = esp32dev            ; générique ESP32-WROOM-32
framework = arduino
monitor_speed = 115200
upload_speed = 460800     
; Laisse PlatformIO auto-détecter le port (recommandé)
; upload_port = /dev/ttyUSB0

lib_deps =
  adafruit/Adafruit PWM Servo Driver Library@^3
  adafruit/Adafruit BusIO@^1

; Optionnel: rendre cet env par défaut
; default_envs = esp32dev
